<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reserve a table | Mesa</title><link rel="stylesheet" href="style.css"></head><body>
<a class="skip" href="#main">Skip to content</a>
<div id="app"><h1>Reserve a table</h1><p>Choose when you are coming. We show only tables that are free for the full 2 hours and big enough for your group.</p>
<form class="panel" id="rform" style="max-width:44rem"><div class="form" style="max-width:none;margin:0"><label>Date <input type="date" name="date" required style="max-width:14rem"></label><fieldset><legend>Time</legend><div class="choices" id="slots"></div></fieldset><label>Guests <input type="number" name="guests" min="1" max="20" required style="max-width:8rem"></label><div><button class="btn">Check availability</button></div></div></form><div id="result"></div></div>
<script src="preview.js"></script></body></html>
